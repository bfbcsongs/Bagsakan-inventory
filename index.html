<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">

<title>RPLMC Tracker</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:900px;
  height:100vh;
  padding:3px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =========================
   DATE + NAME BAR
========================= */

.info-bar{
  height:48px;
  flex-shrink:0;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:5px;
  margin-bottom:3px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:0 8px;
  overflow:hidden;
}

.info-date{
  color:#1d4ed8;
  font-size:19px;
  font-weight:900;
  white-space:nowrap;
}

.info-separator{
  color:#64748b;
  font-size:18px;
  font-weight:900;
}

.info-name{
  color:#111827;
  font-size:19px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================
   TABLE WRAP
========================= */

.table-wrap{
  width:100%;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:5px;
  overflow:hidden;
  flex-shrink:0;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

th,td{
  border:1px solid #cbd5e1;
  text-align:center;
  padding:0;
  overflow:hidden;
}

/* =========================
   SUMMARY
========================= */

.summary-title{
  height:22px;
  background:#111827;
  color:#fff;
  font-size:11px;
  font-weight:900;
  letter-spacing:.5px;
}

.summary-head{
  height:20px;
  background:#e2e8f0;
  color:#111827;
  font-size:10px;
  font-weight:900;
}

.summary-row{
  height:22px;
  font-size:10px;
  font-weight:900;
}

.summary-label{
  width:18%;
  text-align:left;
  padding-left:6px;
}

.summary-value{
  width:16.4%;
}

.del-row{
  color:#166534;
  background:#f0fdf4;
}

.sales-row{
  color:#fff;
  background:#1d4ed8;
}

.ret-row{
  color:#fff;
  background:#c2410c;
}

.del-input{
  width:100%;
  height:20px;
  border:0;
  outline:none;
  background:transparent;
  text-align:center;
  font-weight:900;
  font-size:10px;
  color:#166534;
  padding:0;
}

/* =========================
   CUSTOMER TABLE
========================= */

.customer-wrap{
  flex:1;
  min-height:0;
  overflow:hidden;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:5px;
}

.customer-table{
  height:100%;
}

.customer-table col.name-col{
  width:25%;
}

.customer-table col.qty-col{
  width:10%;
}

.customer-table col.amount-col{
  width:25%;
}

.customer-header{
  height:21px;
  background:#1e293b;
  color:#fff;
  font-size:10px;
  font-weight:900;
}

.customer-header th{
  border-color:#475569;
  cursor:pointer;
  user-select:none;
}

.customer-row{
  height:21px;
  font-size:10px;
  font-weight:700;
  background:#fff;
}

.customer-row:nth-child(even){
  background:#f8fafc;
}

.customer-row td{
  border-color:#cbd5e1;
}

.name-input,
.qty-input{
  width:100%;
  height:20px;
  border:0;
  outline:none;
  background:transparent;
  text-align:center;
  font-size:10px;
  font-weight:700;
  padding:0 2px;
  color:#111827;
}

.name-input{
  text-align:left;
  padding-left:5px;
}

.qty-input:focus,
.name-input:focus{
  background:#fef9c3;
}

.amount-value{
  display:block;
  width:100%;
  text-align:right;
  padding-right:5px;
  font-size:10px;
  font-weight:900;
  color:#111827;
  white-space:nowrap;
}

.total-row{
  height:23px;
  background:#111827;
  color:#fff;
  font-size:10px;
  font-weight:900;
}

.total-row td{
  border-color:#374151;
}

.total-label{
  text-align:right;
  padding-right:5px;
}

/* =========================
   MODALS
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:9999;
}

.modal.hidden{
  display:none;
}

.modal-box{
  width:min(360px,95vw);
  background:#fff;
  border-radius:12px;
  padding:18px;
  box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.modal-title{
  text-align:center;
  font-size:20px;
  font-weight:900;
  color:#111827;
  margin-bottom:15px;
}

.modal-field{
  margin-bottom:12px;
}

.modal-field label{
  display:block;
  font-size:12px;
  font-weight:900;
  color:#334155;
  margin-bottom:5px;
}

.modal-field input{
  width:100%;
  height:42px;
  border:1px solid #94a3b8;
  border-radius:7px;
  padding:0 10px;
  font-size:16px;
  font-weight:700;
  outline:none;
}

.modal-field input:focus{
  border-color:#1d4ed8;
  box-shadow:0 0 0 2px rgba(29,78,216,.12);
}

.setup-error{
  min-height:18px;
  color:#dc2626;
  text-align:center;
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
}

.modal-btn{
  width:100%;
  height:44px;
  border:0;
  border-radius:7px;
  background:#111827;
  color:#fff;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}

.modal-btn:active{
  transform:scale(.98);
}

/* =========================
   MULTIPLIER MODAL
========================= */

.multiplier-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin-bottom:15px;
}

.multiplier-item{
  text-align:center;
}

.multiplier-item label{
  display:block;
  font-size:12px;
  font-weight:900;
  margin-bottom:4px;
}

.multiplier-item input{
  width:100%;
  height:38px;
  border:1px solid #94a3b8;
  border-radius:6px;
  text-align:center;
  font-size:14px;
  font-weight:900;
  outline:none;
}

.multiplier-actions{
  display:flex;
  gap:7px;
}

.multiplier-actions button{
  flex:1;
  height:42px;
  border:0;
  border-radius:7px;
  font-weight:900;
  font-size:14px;
}

.cancel-btn{
  background:#e2e8f0;
  color:#111827;
}

.save-btn{
  background:#16a34a;
  color:#fff;
}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

  .info-bar{
    height:45px;
  }

  .info-date,
  .info-name{
    font-size:17px;
  }

  .info-separator{
    font-size:16px;
  }

  .summary-title{
    height:21px;
  }

  .summary-head,
  .summary-row{
    height:21px;
  }

  .summary-value,
  .summary-label,
  .del-input{
    font-size:10px;
  }

  .customer-header{
    height:20px;
  }

  .customer-row{
    height:20px;
  }

  .name-input,
  .qty-input,
  .amount-value{
    font-size:10px;
  }

  .total-row{
    height:22px;
  }
}

/* =========================
   VERY SHORT SCREENS
========================= */

@media(max-height:650px){

  .info-bar{
    height:40px;
  }

  .info-date,
  .info-name{
    font-size:16px;
  }

  .info-separator{
    font-size:15px;
  }

  .summary-title{
    height:18px;
    font-size:10px;
  }

  .summary-head,
  .summary-row{
    height:19px;
  }

  .summary-value,
  .summary-label,
  .del-input{
    font-size:9px;
  }

  .customer-header{
    height:18px;
  }

  .customer-row{
    height:18px;
  }

  .name-input,
  .qty-input,
  .amount-value{
    height:17px;
    font-size:9px;
  }

  .total-row{
    height:20px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- DATE + NAME -->
  <div class="info-bar">
    <div class="info-date" id="displayDate"></div>
    <div class="info-separator">•</div>
    <div class="info-name" id="displayName"></div>
  </div>

  <!-- SUMMARY -->
  <div class="table-wrap">

    <table>
      <colgroup>
        <col style="width:18%">
        <col style="width:16.4%">
        <col style="width:16.4%">
        <col style="width:16.4%">
        <col style="width:16.4%">
        <col style="width:16.4%">
      </colgroup>

      <thead>
        <tr>
          <th colspan="6" class="summary-title">SUMMARY</th>
        </tr>

        <tr class="summary-head">
          <th>Metric</th>
          <th>R</th>
          <th>P</th>
          <th>L</th>
          <th>M</th>
          <th>C</th>
        </tr>
      </thead>

      <tbody>

        <tr class="summary-row del-row">
          <td class="summary-label">DEL</td>

          <td>
            <input id="delR" class="del-input" type="number" inputmode="decimal">
          </td>

          <td>
            <input id="delP" class="del-input" type="number" inputmode="decimal">
          </td>

          <td>
            <input id="delL" class="del-input" type="number" inputmode="decimal">
          </td>

          <td>
            <input id="delM" class="del-input" type="number" inputmode="decimal">
          </td>

          <td>
            <input id="delC" class="del-input" type="number" inputmode="decimal">
          </td>
        </tr>

        <tr class="summary-row sales-row">
          <td class="summary-label">SALES</td>
          <td id="salesR">0</td>
          <td id="salesP">0</td>
          <td id="salesL">0</td>
          <td id="salesM">0</td>
          <td id="salesC">0</td>
        </tr>

        <tr class="summary-row ret-row">
          <td class="summary-label">RET</td>
          <td id="retR">0</td>
          <td id="retP">0</td>
          <td id="retL">0</td>
          <td id="retM">0</td>
          <td id="retC">0</td>
        </tr>

      </tbody>
    </table>

  </div>

  <!-- CUSTOMER LIST -->
  <div class="customer-wrap">

    <table class="customer-table">

      <colgroup>
        <col class="name-col">
        <col class="qty-col">
        <col class="qty-col">
        <col class="qty-col">
        <col class="qty-col">
        <col class="qty-col">
        <col class="amount-col">
      </colgroup>

      <thead>
        <tr class="customer-header">

          <!-- 5 TAP KEY ICON -->
          <th id="nameHeader" title="5 taps to open settings">🔑</th>

          <th>R</th>
          <th>P</th>
          <th>L</th>
          <th>M</th>
          <th>C</th>

          <th>Amount</th>

        </tr>
      </thead>

      <tbody id="customerBody"></tbody>

      <tfoot>
        <tr class="total-row">

          <td class="total-label">TOTAL</td>

          <td id="totalR">0</td>
          <td id="totalP">0</td>
          <td id="totalL">0</td>
          <td id="totalM">0</td>
          <td id="totalC">0</td>

          <td id="totalAmount">0</td>

        </tr>
      </tfoot>

    </table>

  </div>

</div>


<!-- =========================
     START LEDGER MODAL
========================= -->

<div class="modal" id="setupModal">

  <div class="modal-box">

    <div class="modal-title">Start Ledger</div>

    <div class="modal-field">
      <label for="ledgerDate">DATE</label>
      <input
        type="date"
        id="ledgerDate"
        autocomplete="off"
      >
    </div>

    <div class="modal-field">
      <label for="ledgerName">NAME</label>
      <input
        type="text"
        id="ledgerName"
        autocomplete="off"
        placeholder="Enter name"
      >
    </div>

    <div class="setup-error" id="setupError"></div>

    <button class="modal-btn" id="openLedgerBtn">
      OPEN LEDGER
    </button>

  </div>

</div>


<!-- =========================
     MULTIPLIER MODAL
========================= -->

<div class="modal hidden" id="multiplierModal">

  <div class="modal-box">

    <div class="modal-title">Edit Multipliers</div>

    <div class="multiplier-grid">

      <div class="multiplier-item">
        <label>R</label>
        <input id="multR" type="number" inputmode="decimal">
      </div>

      <div class="multiplier-item">
        <label>P</label>
        <input id="multP" type="number" inputmode="decimal">
      </div>

      <div class="multiplier-item">
        <label>L</label>
        <input id="multL" type="number" inputmode="decimal">
      </div>

      <div class="multiplier-item">
        <label>M</label>
        <input id="multM" type="number" inputmode="decimal">
      </div>

      <div class="multiplier-item">
        <label>C</label>
        <input id="multC" type="number" inputmode="decimal">
      </div>

    </div>

    <div class="multiplier-actions">

      <button
        class="cancel-btn"
        id="cancelMultiplier"
      >
        CANCEL
      </button>

      <button
        class="save-btn"
        id="saveMultiplier"
      >
        SAVE
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SERVICE WORKER
===================================================== */

if ('serviceWorker' in navigator) {

  window.addEventListener('load', () => {

    navigator.serviceWorker.register(
      './sw.js?v=1',
      {scope:'./'}
    )

    .then(reg => {
      console.log('Service Worker Registered!');
    })

    .catch(err => {
      console.log(
        'Service Worker Registration Failed:',
        err
      );
    });

  });

}


/* =====================================================
   DEFAULT MULTIPLIERS
===================================================== */

const DEFAULT_MULTIPLIERS = {
  R:45,
  P:45,
  L:45,
  M:45,
  C:40
};

let multipliers =
  JSON.parse(
    localStorage.getItem("rplmc_multipliers")
  ) || {...DEFAULT_MULTIPLIERS};


/* =====================================================
   ELEMENTS
===================================================== */

const setupModal =
  document.getElementById("setupModal");

const setupError =
  document.getElementById("setupError");

const ledgerDate =
  document.getElementById("ledgerDate");

const ledgerName =
  document.getElementById("ledgerName");

const displayDate =
  document.getElementById("displayDate");

const displayName =
  document.getElementById("displayName");

const customerBody =
  document.getElementById("customerBody");

const multiplierModal =
  document.getElementById("multiplierModal");

const nameHeader =
  document.getElementById("nameHeader");


/* =====================================================
   NUMBER HELPER
===================================================== */

function num(value){

  const n = parseFloat(value);

  return Number.isFinite(n) ? n : 0;

}


/* =====================================================
   AMOUNT FORMAT
   Removes unnecessary .00
===================================================== */

function formatAmount(value){

  const n = num(value);

  if(n === 0){
    return "0";
  }

  if(Number.isInteger(n)){
    return String(n);
  }

  return n
    .toFixed(2)
    .replace(/\.?0+$/,"");

}


/* =====================================================
   TODAY
===================================================== */

function getToday(){

  const d = new Date();

  const y =
    d.getFullYear();

  const m =
    String(d.getMonth()+1)
      .padStart(2,"0");

  const day =
    String(d.getDate())
      .padStart(2,"0");

  return `${y}-${m}-${day}`;

}


/* =====================================================
   DATE FORMAT
   Example: Oct 5, 2026
===================================================== */

function formatDate(value){

  if(!value){
    return "";
  }

  const parts =
    value.split("-");

  if(parts.length !== 3){
    return value;
  }

  const y =
    Number(parts[0]);

  const m =
    Number(parts[1]);

  const d =
    Number(parts[2]);

  const months = [
    "Jan",
    "Feb",
    "Mar",
    "Apr",
    "May",
    "Jun",
    "Jul",
    "Aug",
    "Sep",
    "Oct",
    "Nov",
    "Dec"
  ];

  return `${months[m-1]} ${d}, ${y}`;

}


/* =====================================================
   BUILD 19 CUSTOMER ROWS
===================================================== */

function buildRows(){

  customerBody.innerHTML = "";

  for(let i=1;i<=19;i++){

    const tr =
      document.createElement("tr");

    tr.className =
      "customer-row";

    tr.innerHTML = `

      <td>
        <input
          class="name-input"
          type="text"
          autocomplete="off"
        >
      </td>

      <td>
        <input
          class="qty-input qty-r"
          type="number"
          inputmode="decimal"
        >
      </td>

      <td>
        <input
          class="qty-input qty-p"
          type="number"
          inputmode="decimal"
        >
      </td>

      <td>
        <input
          class="qty-input qty-l"
          type="number"
          inputmode="decimal"
        >
      </td>

      <td>
        <input
          class="qty-input qty-m"
          type="number"
          inputmode="decimal"
        >
      </td>

      <td>
        <input
          class="qty-input qty-c"
          type="number"
          inputmode="decimal"
        >
      </td>

      <td>
        <span class="amount-value">0</span>
      </td>

    `;

    customerBody.appendChild(tr);

  }


  document
    .querySelectorAll(".qty-input")
    .forEach(input => {

      input.addEventListener(
        "input",
        calculate
      );

    });


  document
    .querySelectorAll(".name-input")
    .forEach(input => {

      input.addEventListener(
        "input",
        calculate
      );

    });

}


/* =====================================================
   CALCULATE
===================================================== */

function calculate(){

  let totalR = 0;
  let totalP = 0;
  let totalL = 0;
  let totalM = 0;
  let totalC = 0;

  let totalAmount = 0;


  const rows =
    document.querySelectorAll(
      ".customer-row"
    );


  rows.forEach(row => {

    const r =
      num(
        row.querySelector(".qty-r").value
      );

    const p =
      num(
        row.querySelector(".qty-p").value
      );

    const l =
      num(
        row.querySelector(".qty-l").value
      );

    const m =
      num(
        row.querySelector(".qty-m").value
      );

    const c =
      num(
        row.querySelector(".qty-c").value
      );


    totalR += r;
    totalP += p;
    totalL += l;
    totalM += m;
    totalC += c;


    const amount =
      (r * multipliers.R) +
      (p * multipliers.P) +
      (l * multipliers.L) +
      (m * multipliers.M) +
      (c * multipliers.C);


    totalAmount += amount;


    row.querySelector(
      ".amount-value"
    ).textContent =
      formatAmount(amount);

  });


  /* TOTALS */

  document.getElementById(
    "totalR"
  ).textContent =
    formatAmount(totalR);

  document.getElementById(
    "totalP"
  ).textContent =
    formatAmount(totalP);

  document.getElementById(
    "totalL"
  ).textContent =
    formatAmount(totalL);

  document.getElementById(
    "totalM"
  ).textContent =
    formatAmount(totalM);

  document.getElementById(
    "totalC"
  ).textContent =
    formatAmount(totalC);

  document.getElementById(
    "totalAmount"
  ).textContent =
    formatAmount(totalAmount);


  /* SALES */

  document.getElementById(
    "salesR"
  ).textContent =
    formatAmount(totalR);

  document.getElementById(
    "salesP"
  ).textContent =
    formatAmount(totalP);

  document.getElementById(
    "salesL"
  ).textContent =
    formatAmount(totalL);

  document.getElementById(
    "salesM"
  ).textContent =
    formatAmount(totalM);

  document.getElementById(
    "salesC"
  ).textContent =
    formatAmount(totalC);


  /* RET */

  const delR =
    num(
      document.getElementById(
        "delR"
      ).value
    );

  const delP =
    num(
      document.getElementById(
        "delP"
      ).value
    );

  const delL =
    num(
      document.getElementById(
        "delL"
      ).value
    );

  const delM =
    num(
      document.getElementById(
        "delM"
      ).value
    );

  const delC =
    num(
      document.getElementById(
        "delC"
      ).value
    );


  document.getElementById(
    "retR"
  ).textContent =
    formatAmount(
      delR - totalR
    );

  document.getElementById(
    "retP"
  ).textContent =
    formatAmount(
      delP - totalP
    );

  document.getElementById(
    "retL"
  ).textContent =
    formatAmount(
      delL - totalL
    );

  document.getElementById(
    "retM"
  ).textContent =
    formatAmount(
      delM - totalM
    );

  document.getElementById(
    "retC"
  ).textContent =
    formatAmount(
      delC - totalC
    );

}


/* =====================================================
   START LEDGER
   DATE + NAME MUST BOTH BE FILLED
===================================================== */

function startLedger(){

  const date =
    ledgerDate.value.trim();

  const name =
    ledgerName.value.trim();


  if(!date && !name){

    setupError.textContent =
      "Please enter Date and Name.";

    return;

  }

  if(!date){

    setupError.textContent =
      "Please enter the Date.";

    ledgerDate.focus();

    return;

  }

  if(!name){

    setupError.textContent =
      "Please enter the Name.";

    ledgerName.focus();

    return;

  }


  /* DISPLAY */

  displayDate.textContent =
    formatDate(date);

  displayName.textContent =
    name;


  /* SAVE ONLY AFTER VALID OPEN */

  localStorage.setItem(
    "rplmc_ledger_date",
    date
  );

  localStorage.setItem(
    "rplmc_ledger_name",
    name
  );


  setupError.textContent = "";

  setupModal.classList.add(
    "hidden"
  );

}


/* =====================================================
   LOAD SESSION
   IMPORTANT:
   START MODAL IS ALWAYS EMPTY
===================================================== */

function loadSession(){

  /*
    Do NOT prefill Date or Name.
    User specifically requested that
    both fields are empty whenever
    Start Ledger opens.
  */

  ledgerDate.value = "";
  ledgerName.value = "";

  displayDate.textContent = "";
  displayName.textContent = "";

  setupError.textContent = "";

  setupModal.classList.remove(
    "hidden"
  );

}


/* =====================================================
   MULTIPLIER EDITOR
===================================================== */

function openMultiplierEditor(){

  document.getElementById(
    "multR"
  ).value =
    multipliers.R;

  document.getElementById(
    "multP"
  ).value =
    multipliers.P;

  document.getElementById(
    "multL"
  ).value =
    multipliers.L;

  document.getElementById(
    "multM"
  ).value =
    multipliers.M;

  document.getElementById(
    "multC"
  ).value =
    multipliers.C;


  multiplierModal.classList.remove(
    "hidden"
  );

}


/* =====================================================
   SAVE MULTIPLIERS
===================================================== */

function saveMultipliers(){

  multipliers = {

    R:
      num(
        document.getElementById(
          "multR"
        ).value
      ),

    P:
      num(
        document.getElementById(
          "multP"
        ).value
      ),

    L:
      num(
        document.getElementById(
          "multL"
        ).value
      ),

    M:
      num(
        document.getElementById(
          "multM"
        ).value
      ),

    C:
      num(
        document.getElementById(
          "multC"
        ).value
      )

  };


  localStorage.setItem(
    "rplmc_multipliers",
    JSON.stringify(multipliers)
  );


  multiplierModal.classList.add(
    "hidden"
  );


  calculate();

}


/* =====================================================
   EVENTS
===================================================== */

document
  .getElementById("openLedgerBtn")
  .addEventListener(
    "click",
    startLedger
  );


/* Enter on Name */

ledgerName.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter"){
      startLedger();
    }

  }
);


/* Date/Name validation feedback */

ledgerDate.addEventListener(
  "input",
  () => {

    setupError.textContent = "";

  }
);

ledgerName.addEventListener(
  "input",
  () => {

    setupError.textContent = "";

  }
);


/* =====================================================
   5-TAP KEY ICON
===================================================== */

let tapCount = 0;
let tapTimer = null;

nameHeader.addEventListener(
  "click",
  () => {

    tapCount++;

    clearTimeout(tapTimer);

    tapTimer =
      setTimeout(() => {

        tapCount = 0;

      },1000);


    if(tapCount >= 5){

      tapCount = 0;

      clearTimeout(tapTimer);

      openMultiplierEditor();

    }

  }
);


/* =====================================================
   CLOSE MULTIPLIER MODAL
   TAP OUTSIDE
===================================================== */

multiplierModal.addEventListener(
  "click",
  e => {

    if(e.target === multiplierModal){

      multiplierModal.classList.add(
        "hidden"
      );

    }

  }
);


/* CANCEL */

document
  .getElementById("cancelMultiplier")
  .addEventListener(
    "click",
    () => {

      multiplierModal.classList.add(
        "hidden"
      );

    }
  );


/* SAVE */

document
  .getElementById("saveMultiplier")
  .addEventListener(
    "click",
    saveMultipliers
  );


/* =====================================================
   DEL INPUT EVENTS
===================================================== */

[
  "delR",
  "delP",
  "delL",
  "delM",
  "delC"
].forEach(id => {

  document
    .getElementById(id)
    .addEventListener(
      "input",
      calculate
    );

});


/* =====================================================
   INITIALIZE
===================================================== */

buildRows();

calculate();

loadSession();

</script>

</body>
</html>
