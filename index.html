<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>RPLMC Tracker</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#f1f5f9;
  color:#111827;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:900px;
  height:100vh;
  padding:4px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =========================
   HEADER
========================= */

.app-title{
  height:28px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:900;
  background:#111827;
  color:white;
  border-radius:5px;
  margin-bottom:3px;
}

/* =========================
   DATE + NAME BAR
========================= */

.info-bar{
  position:relative;
  height:32px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  background:white;
  border:1px solid #cbd5e1;
  border-radius:5px;
  margin-bottom:3px;
  font-size:11px;
  font-weight:800;
  color:#334155;
  text-transform:none;
}

.info-date{
  color:#1d4ed8;
}

.info-separator{
  color:#94a3b8;
}

.info-name{
  color:#111827;
}

/* =========================
   TABLE CONTAINERS
========================= */

.table-wrap{
  background:white;
  border:1px solid #cbd5e1;
  border-radius:5px;
  overflow:hidden;
  flex-shrink:0;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

th,
td{
  border:1px solid #cbd5e1;
  padding:2px;
  text-align:center;
  height:25px;
  font-size:11px;
}

th{
  background:#e2e8f0;
  font-weight:900;
}

td:first-child,
th:first-child{
  width:25%;
}

/* =========================
   SUMMARY TABLE
========================= */

.summary-title{
  background:#1e293b;
  color:white;
  font-size:11px;
  font-weight:900;
}

.summary-table input{
  width:100%;
  height:21px;
  border:0;
  outline:none;
  text-align:center;
  font-size:11px;
  font-weight:700;
  background:transparent;
}

.summary-table .metric{
  font-weight:900;
  background:#f8fafc;
}

/* SALES */

.sales-row td{
  background:#eff6ff;
}

.sales-row .metric{
  color:#1d4ed8;
}

.sales-value{
  color:#1d4ed8;
  font-weight:900;
}

/* RET */

.ret-row td{
  background:#fff7ed;
}

.ret-row .metric{
  color:#c2410c;
}

.ret-value{
  color:#c2410c;
  font-weight:900;
}

/* DEL */

.del-row td{
  background:#f0fdf4;
}

.del-row .metric{
  color:#15803d;
}

/* =========================
   ITEMIZED TABLE
========================= */

.entries-wrap{
  flex:1;
  min-height:0;
  margin-top:3px;
  background:white;
  border:1px solid #cbd5e1;
  border-radius:5px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.entries-scroll{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
}

.entries-table th{
  position:sticky;
  top:0;
  z-index:3;
  background:#1e293b;
  color:white;
}

.entries-table th:first-child{
  width:30%;
}

.entries-table th:not(:first-child){
  width:14%;
}

.entries-table input{
  width:100%;
  height:22px;
  border:0;
  outline:none;
  text-align:center;
  font-size:11px;
  font-weight:700;
  background:white;
  padding:0;
}

.entries-table input:focus{
  background:#eff6ff;
}

.name-input{
  text-align:left !important;
  padding-left:4px !important;
}

/* TOTAL */

.total-row td{
  position:sticky;
  bottom:0;
  z-index:2;
  background:#111827;
  color:white;
  font-weight:900;
}

.total-row td:first-child{
  text-align:left;
  padding-left:5px;
}

/* =========================
   MODAL
========================= */

.modal-overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(15,23,42,.72);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal{
  width:min(360px,100%);
  background:white;
  border-radius:10px;
  padding:18px;
  box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.modal-title{
  text-align:center;
  font-size:18px;
  font-weight:900;
  color:#111827;
  margin-bottom:5px;
}

.modal-subtitle{
  text-align:center;
  font-size:11px;
  color:#64748b;
  margin-bottom:15px;
}

.modal label{
  display:block;
  font-size:11px;
  font-weight:800;
  color:#334155;
  margin-bottom:4px;
}

.modal input{
  width:100%;
  height:40px;
  border:1px solid #cbd5e1;
  border-radius:6px;
  outline:none;
  padding:0 10px;
  font-size:14px;
  margin-bottom:12px;
}

.modal input:focus{
  border-color:#2563eb;
}

.start-btn{
  width:100%;
  height:42px;
  border:0;
  border-radius:6px;
  background:#16a34a;
  color:white;
  font-size:14px;
  font-weight:900;
}

.start-btn:active{
  transform:scale(.98);
}

.error-message{
  text-align:center;
  color:#dc2626;
  font-size:11px;
  font-weight:700;
  min-height:15px;
  margin-bottom:5px;
}

/* =========================
   SMALL SCREEN
========================= */

@media(max-width:480px){

  .app{
    padding:3px;
  }

  .app-title{
    height:27px;
    font-size:14px;
  }

  .info-bar{
    height:30px;
    font-size:10px;
    gap:8px;
  }

  th,
  td{
    height:24px;
    font-size:10px;
  }

  .entries-table input,
  .summary-table input{
    font-size:10px;
  }

}

</style>
</head>

<body>

<div class="app">

  <div class="app-title">
    RPLMC TRACKER
  </div>

  <!-- DATE + NAME -->
  <div class="info-bar">

    <span
      class="info-date"
      id="displayDate">
      Oct 5, 2026
    </span>

    <span class="info-separator">•</span>

    <span
      class="info-name"
      id="displayName">
      Name
    </span>

  </div>


  <!-- =========================
       SUMMARY TABLE
  ========================== -->

  <div class="table-wrap">

    <table class="summary-table">

      <thead>

        <tr>

          <th colspan="6" class="summary-title">
            SUMMARY
          </th>

        </tr>

        <tr>

          <th>Metric</th>
          <th>R</th>
          <th>P</th>
          <th>L</th>
          <th>M</th>
          <th>C</th>

        </tr>

      </thead>

      <tbody>

        <!-- DEL -->

        <tr class="del-row">

          <td class="metric">
            DEL
          </td>

          <td>
            <input
              type="number"
              id="delR"
              inputmode="decimal"
              oninput="calculate()"
            >
          </td>

          <td>
            <input
              type="number"
              id="delP"
              inputmode="decimal"
              oninput="calculate()"
            >
          </td>

          <td>
            <input
              type="number"
              id="delL"
              inputmode="decimal"
              oninput="calculate()"
            >
          </td>

          <td>
            <input
              type="number"
              id="delM"
              inputmode="decimal"
              oninput="calculate()"
            >
          </td>

          <td>
            <input
              type="number"
              id="delC"
              inputmode="decimal"
              oninput="calculate()"
            >
          </td>

        </tr>


        <!-- SALES -->

        <tr class="sales-row">

          <td class="metric">
            SALES
          </td>

          <td
            id="salesR"
            class="sales-value">
            0
          </td>

          <td
            id="salesP"
            class="sales-value">
            0
          </td>

          <td
            id="salesL"
            class="sales-value">
            0
          </td>

          <td
            id="salesM"
            class="sales-value">
            0
          </td>

          <td
            id="salesC"
            class="sales-value">
            0
          </td>

        </tr>


        <!-- RET -->

        <tr class="ret-row">

          <td class="metric">
            RET
          </td>

          <td
            id="retR"
            class="ret-value">
            0
          </td>

          <td
            id="retP"
            class="ret-value">
            0
          </td>

          <td
            id="retL"
            class="ret-value">
            0
          </td>

          <td
            id="retM"
            class="ret-value">
            0
          </td>

          <td
            id="retC"
            class="ret-value">
            0
          </td>

        </tr>

      </tbody>

    </table>

  </div>


  <!-- =========================
       ITEMIZED ENTRIES
  ========================== -->

  <div class="entries-wrap">

    <div class="entries-scroll">

      <table class="entries-table">

        <thead>

          <tr>

            <th>Name</th>
            <th>R</th>
            <th>P</th>
            <th>L</th>
            <th>M</th>
            <th>C</th>

          </tr>

        </thead>

        <tbody id="entryBody">
        </tbody>

        <tfoot>

          <tr class="total-row">

            <td>
              TOTAL
            </td>

            <td id="totalR">
              0
            </td>

            <td id="totalP">
              0
            </td>

            <td id="totalL">
              0
            </td>

            <td id="totalM">
              0
            </td>

            <td id="totalC">
              0
            </td>

          </tr>

        </tfoot>

      </table>

    </div>

  </div>

</div>


<!-- =========================
     DATE + NAME MODAL
========================= -->

<div
  class="modal-overlay"
  id="setupModal"
>

  <div class="modal">

    <div class="modal-title">
      Start Ledger
    </div>

    <div class="modal-subtitle">
      Enter the date and name before opening the ledger.
    </div>

    <label for="ledgerDate">
      Date
    </label>

    <input
      type="date"
      id="ledgerDate"
    >

    <label for="ledgerName">
      Name
    </label>

    <input
      type="text"
      id="ledgerName"
      placeholder="Enter name"
      autocomplete="off"
    >

    <div
      class="error-message"
      id="setupError">
    </div>

    <button
      class="start-btn"
      onclick="startLedger()">
      OPEN LEDGER
    </button>

  </div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

const ROW_COUNT = 19;


/* =========================
   DATE FORMAT
========================= */

function formatDate(value){

  if(!value) return "";

  const parts=value.split("-");

  if(parts.length!==3){
    return value;
  }

  const year=Number(parts[0]);
  const month=Number(parts[1]);
  const day=Number(parts[2]);

  const months=[
    "Jan",
    "Feb",
    "Mar",
    "Apr",
    "May",
    "Jun",
    "Jul",
    "Aug",
    "Sep",
    "Oct",
    "Nov",
    "Dec"
  ];

  return `${months[month-1]} ${day}, ${year}`;
}


/* =========================
   TODAY
========================= */

function getToday(){

  const now=new Date();

  const year=now.getFullYear();

  const month=String(
    now.getMonth()+1
  ).padStart(2,"0");

  const day=String(
    now.getDate()
  ).padStart(2,"0");

  return `${year}-${month}-${day}`;
}


/* =========================
   BUILD 19 ROWS
========================= */

function buildRows(){

  const body=
    document.getElementById(
      "entryBody"
    );

  body.innerHTML="";

  for(let i=1;i<=ROW_COUNT;i++){

    const tr=document.createElement("tr");

    tr.innerHTML=`

      <td>
        <input
          type="text"
          class="name-input"
          placeholder="${i}"
          autocomplete="off"
        >
      </td>

      <td>
        <input
          type="number"
          class="qty-r"
          inputmode="decimal"
          oninput="calculate()"
        >
      </td>

      <td>
        <input
          type="number"
          class="qty-p"
          inputmode="decimal"
          oninput="calculate()"
        >
      </td>

      <td>
        <input
          type="number"
          class="qty-l"
          inputmode="decimal"
          oninput="calculate()"
        >
      </td>

      <td>
        <input
          type="number"
          class="qty-m"
          inputmode="decimal"
          oninput="calculate()"
        >
      </td>

      <td>
        <input
          type="number"
          class="qty-c"
          inputmode="decimal"
          oninput="calculate()"
        >
      </td>

    `;

    body.appendChild(tr);
  }

}


/* =========================
   NUMBER HELPER
========================= */

function num(value){

  const n=parseFloat(value);

  return Number.isFinite(n) ? n : 0;
}


/* =========================
   CALCULATE
========================= */

function calculate(){

  const types=[
    "R",
    "P",
    "L",
    "M",
    "C"
  ];

  const totals={
    R:0,
    P:0,
    L:0,
    M:0,
    C:0
  };


  /* ITEMIZED SALES */

  document
    .querySelectorAll(".qty-r")
    .forEach(input=>{
      totals.R += num(input.value);
    });

  document
    .querySelectorAll(".qty-p")
    .forEach(input=>{
      totals.P += num(input.value);
    });

  document
    .querySelectorAll(".qty-l")
    .forEach(input=>{
      totals.L += num(input.value);
    });

  document
    .querySelectorAll(".qty-m")
    .forEach(input=>{
      totals.M += num(input.value);
    });

  document
    .querySelectorAll(".qty-c")
    .forEach(input=>{
      totals.C += num(input.value);
    });


  /* DISPLAY SALES */

  document.getElementById("salesR")
    .textContent=totals.R;

  document.getElementById("salesP")
    .textContent=totals.P;

  document.getElementById("salesL")
    .textContent=totals.L;

  document.getElementById("salesM")
    .textContent=totals.M;

  document.getElementById("salesC")
    .textContent=totals.C;


  /* DISPLAY TOTAL */

  document.getElementById("totalR")
    .textContent=totals.R;

  document.getElementById("totalP")
    .textContent=totals.P;

  document.getElementById("totalL")
    .textContent=totals.L;

  document.getElementById("totalM")
    .textContent=totals.M;

  document.getElementById("totalC")
    .textContent=totals.C;


  /* =========================
     RET = DEL - SALES
  ========================== */

  types.forEach(type=>{

    const delInput=
      document.getElementById(
        "del"+type
      );

    const sales=
      totals[type];

    const del=
      num(delInput.value);

    const ret=
      del-sales;

    document.getElementById(
      "ret"+type
    ).textContent=ret;

  });

}


/* =========================
   START LEDGER
========================= */

function startLedger(){

  const date=
    document.getElementById(
      "ledgerDate"
    ).value;

  const name=
    document.getElementById(
      "ledgerName"
    ).value.trim();

  const error=
    document.getElementById(
      "setupError"
    );


  if(!date){

    error.textContent=
      "Please select a date.";

    return;
  }


  if(!name){

    error.textContent=
      "Please enter a name.";

    return;
  }


  /* SAVE SESSION INFO */

  localStorage.setItem(
    "rplmc_ledger_date",
    date
  );

  localStorage.setItem(
    "rplmc_ledger_name",
    name
  );


  /* DISPLAY */

  document.getElementById(
    "displayDate"
  ).textContent=
    formatDate(date);

  document.getElementById(
    "displayName"
  ).textContent=
    name;


  /* CLOSE MODAL */

  document.getElementById(
    "setupModal"
  ).style.display="none";


  calculate();

}


/* =========================
   LOAD SAVED SESSION
========================= */

function loadSession(){

  const savedDate=
    localStorage.getItem(
      "rplmc_ledger_date"
    );

  const savedName=
    localStorage.getItem(
      "rplmc_ledger_name"
    );


  /*
    Always show the modal when
    the ledger is opened.
  */

  document.getElementById(
    "setupModal"
  ).style.display="flex";


  /*
    Pre-fill today's date or
    previously used date.
  */

  document.getElementById(
    "ledgerDate"
  ).value=
    savedDate || getToday();


  if(savedName){

    document.getElementById(
      "ledgerName"
    ).value=savedName;

  }

}


/* =========================
   INITIALIZE
========================= */

buildRows();

loadSession();

calculate();


/* =========================
   ENTER KEY
========================= */

document
  .getElementById("ledgerName")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key==="Enter"){
        startLedger();
      }

    }
  );

</script>

</body>
</html>
