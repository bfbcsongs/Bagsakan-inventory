<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">

<title>RPLMC Tracker</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:900px;
  height:100vh;
  padding:2px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =========================
   DATE + NAME + BUTTONS
========================= */

.info-bar{
  height:43px;
  flex-shrink:0;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:4px;
  margin-bottom:2px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:0 4px;
  overflow:hidden;
}

.info-date{
  color:#1d4ed8;
  font-size:17px;
  font-weight:900;
  white-space:nowrap;
  flex-shrink:0;
}

.info-separator{
  color:#64748b;
  font-size:15px;
  font-weight:900;
  flex-shrink:0;
}

.info-name{
  color:#111827;
  font-size:17px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  flex:1;
  min-width:20px;
}

.info-buttons{
  display:flex;
  gap:3px;
  flex-shrink:0;
}

.info-btn{
  height:30px;
  border:0;
  border-radius:5px;
  padding:0 7px;
  color:#fff;
  font-size:9px;
  font-weight:900;
}

.clear-btn{
  background:#dc2626;
}

.save-main-btn{
  background:#16a34a;
}

.list-btn{
  background:#1d4ed8;
}

/* =========================
   SUMMARY
========================= */

.table-wrap{
  width:100%;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:4px;
  overflow:hidden;
  flex-shrink:0;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

th,td{
  border:1px solid #cbd5e1;
  text-align:center;
  padding:0;
  overflow:hidden;
}

.summary-title{
  height:18px;
  background:#111827;
  color:#fff;
  font-size:10px;
  font-weight:900;
  letter-spacing:.4px;
}

.summary-head{
  height:17px;
  background:#e2e8f0;
  color:#111827;
  font-size:9px;
  font-weight:900;
}

.summary-row{
  height:17px;
  font-size:9px;
  font-weight:900;
}

.summary-label{
  width:18%;
  text-align:left;
  padding-left:5px;
}

.summary-value{
  width:16.4%;
}

.del-row{
  color:#166534;
  background:#f0fdf4;
}

.sales-row{
  color:#fff;
  background:#1d4ed8;
}

.ret-row{
  color:#fff;
  background:#c2410c;
}

.del-input{
  width:100%;
  height:15px;
  border:0;
  outline:none;
  background:transparent;
  text-align:center;
  font-weight:900;
  font-size:9px;
  color:#166534;
  padding:0;
}

/* =========================
   CUSTOMER TABLE
========================= */

.customer-wrap{
  flex:1 1 0;
  min-height:0;
  height:0;
  overflow:hidden;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:4px;
}

.customer-table{
  width:100%;
  height:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

.customer-table col.name-col{
  width:25%;
}

.customer-table col.qty-col{
  width:10%;
}

.customer-table col.amount-col{
  width:25%;
}

.customer-header{
  height:16px;
  background:#1e293b;
  color:#fff;
  font-size:9px;
  font-weight:900;
}

.customer-header th{
  border-color:#475569;
  cursor:pointer;
  user-select:none;
}

.customer-row{
  height:15px;
  font-size:8px;
  font-weight:700;
  background:#fff;
}

.customer-row:nth-child(even){
  background:#f8fafc;
}

.customer-row td{
  border-color:#cbd5e1;
}

.name-input,
.qty-input{
  width:100%;
  height:14px;
  border:0;
  outline:none;
  background:transparent;
  text-align:center;
  font-size:8px;
  font-weight:700;
  padding:0 2px;
  color:#111827;
}

.name-input{
  text-align:left;
  padding-left:4px;
}

.qty-input:focus,
.name-input:focus{
  background:#fef9c3;
}

.amount-value{
  display:block;
  width:100%;
  text-align:right;
  padding-right:4px;
  font-size:8px;
  font-weight:900;
  color:#111827;
  white-space:nowrap;
}

.total-row{
  height:17px;
  background:#111827;
  color:#fff;
  font-size:8px;
  font-weight:900;
}

.total-row td{
  border-color:#374151;
}

.total-label{
  text-align:right;
  padding-right:4px;
}

/* =========================
   MODALS
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:9999;
}

.modal.hidden{
  display:none;
}

.modal-box{
  width:min(360px,95vw);
  max-height:90vh;
  background:#fff;
  border-radius:12px;
  padding:18px;
  box-shadow:0 20px 50px rgba(0,0,0,.3);
  overflow:hidden;
}

.modal-title{
  text-align:center;
  font-size:20px;
  font-weight:900;
  color:#111827;
  margin-bottom:15px;
}

.modal-field{
  margin-bottom:12px;
}

.modal-field label{
  display:block;
  font-size:12px;
  font-weight:900;
  color:#334155;
  margin-bottom:5px;
}

.modal-field input{
  width:100%;
  height:42px;
  border:1px solid #94a3b8;
  border-radius:7px;
  padding:0 10px;
  font-size:16px;
  font-weight:700;
  outline:none;
}

.modal-field input:focus{
  border-color:#1d4ed8;
  box-shadow:0 0 0 2px rgba(29,78,216,.12);
}

.setup-error{
  min-height:18px;
  color:#dc2626;
  text-align:center;
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
}

.modal-btn{
  width:100%;
  height:44px;
  border:0;
  border-radius:7px;
  background:#111827;
  color:#fff;
  font-size:15px;
  font-weight:900;
}

/* =========================
   MULTIPLIER MODAL
========================= */

.multiplier-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin-bottom:15px;
}

.multiplier-item{
  text-align:center;
}

.multiplier-item label{
  display:block;
  font-size:12px;
  font-weight:900;
  margin-bottom:4px;
}

.multiplier-item input{
  width:100%;
  height:38px;
  border:1px solid #94a3b8;
  border-radius:6px;
  text-align:center;
  font-size:14px;
  font-weight:900;
  outline:none;
}

.multiplier-actions{
  display:flex;
  gap:7px;
}

.multiplier-actions button{
  flex:1;
  height:42px;
  border:0;
  border-radius:7px;
  font-weight:900;
  font-size:14px;
}

.cancel-btn{
  background:#e2e8f0;
  color:#111827;
}

.save-btn{
  background:#16a34a;
  color:#fff;
}

/* =========================
   LIST MODAL
========================= */

.list-modal-box{
  width:min(420px,95vw);
  max-height:88vh;
  background:#fff;
  border-radius:12px;
  padding:12px;
  box-shadow:0 20px 50px rgba(0,0,0,.3);
  display:flex;
  flex-direction:column;
  min-height:0;
}

.list-title{
  text-align:center;
  font-size:18px;
  font-weight:900;
  color:#111827;
  margin-bottom:9px;
  flex-shrink:0;
}

.list-subtitle{
  text-align:center;
  font-size:10px;
  color:#64748b;
  font-weight:700;
  margin-bottom:8px;
  flex-shrink:0;
}

.saved-list{
  display:flex;
  flex-direction:column;
  gap:5px;
  min-height:0;
  max-height:360px;
  overflow-y:auto;
  padding-right:2px;
}

.saved-item{
  border:1px solid #cbd5e1;
  border-radius:7px;
  background:#f8fafc;
  padding:7px;
  flex-shrink:0;
  user-select:none;
}

.saved-item.highlighted{
  background:#dbeafe;
  border:2px solid #2563eb;
}

.saved-main{
  display:flex;
  align-items:center;
  gap:7px;
  cursor:pointer;
}

.saved-number{
  width:22px;
  height:22px;
  border-radius:50%;
  background:#111827;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  font-weight:900;
  flex-shrink:0;
}

.saved-item.highlighted .saved-number{
  background:#2563eb;
}

.saved-info{
  flex:1;
  min-width:0;
}

.saved-date{
  font-size:12px;
  font-weight:900;
  color:#1d4ed8;
  white-space:nowrap;
}

.saved-name{
  font-size:12px;
  font-weight:900;
  color:#111827;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.saved-time{
  font-size:9px;
  color:#64748b;
  font-weight:700;
  margin-top:2px;
}

.saved-actions{
  display:flex;
  gap:4px;
  margin-top:5px;
  padding-left:29px;
}

.saved-action{
  height:25px;
  border:0;
  border-radius:5px;
  color:#fff;
  font-size:9px;
  font-weight:900;
  padding:0 10px;
}

.edit-saved-btn{
  background:#16a34a;
}

.delete-saved-btn{
  background:#dc2626;
}

.list-close-btn{
  width:100%;
  height:40px;
  border:0;
  border-radius:7px;
  background:#111827;
  color:#fff;
  font-size:13px;
  font-weight:900;
  margin-top:9px;
  flex-shrink:0;
}

.empty-list{
  text-align:center;
  padding:25px 10px;
  color:#64748b;
  font-size:12px;
  font-weight:800;
}

/* =========================
   READ ONLY
========================= */

.readonly-mode input{
  pointer-events:none;
  user-select:none;
}

.readonly-mode .del-input{
  color:#166534;
}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

  .info-bar{
    height:40px;
    gap:3px;
    padding:0 3px;
  }

  .info-date,
  .info-name{
    font-size:14px;
  }

  .info-separator{
    font-size:13px;
  }

  .info-btn{
    height:28px;
    padding:0 5px;
    font-size:8px;
  }

  .summary-title{
    height:17px;
  }

  .summary-head,
  .summary-row{
    height:16px;
  }

  .customer-header{
    height:15px;
  }

  .customer-row{
    height:14px;
  }

  .name-input,
  .qty-input{
    height:13px;
    font-size:7px;
  }

  .amount-value{
    font-size:7px;
  }

  .total-row{
    height:16px;
  }

}

/* =========================
   SHORT SCREEN
========================= */

@media(max-height:650px){

  .app{
    padding:1px;
  }

  .info-bar{
    height:34px;
    margin-bottom:1px;
  }

  .info-date,
  .info-name{
    font-size:13px;
  }

  .info-separator{
    font-size:12px;
  }

  .info-btn{
    height:25px;
    font-size:7px;
    padding:0 4px;
  }

  .summary-title{
    height:15px;
    font-size:8px;
  }

  .summary-head,
  .summary-row{
    height:14px;
    font-size:8px;
  }

  .del-input{
    height:12px;
    font-size:8px;
  }

  .customer-header{
    height:14px;
    font-size:7px;
  }

  .customer-row{
    height:13px;
    font-size:7px;
  }

  .name-input,
  .qty-input{
    height:12px;
    font-size:7px;
  }

  .amount-value{
    font-size:7px;
  }

  .total-row{
    height:15px;
    font-size:7px;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- DATE + NAME + BUTTONS -->
  <div class="info-bar">

    <div class="info-date" id="displayDate"></div>

    <div class="info-separator">•</div>

    <div class="info-name" id="displayName"></div>

    <div class="info-buttons">

      <button
        class="info-btn clear-btn"
        id="clearBtn"
      >
        CLEAR
      </button>

      <button
        class="info-btn save-main-btn"
        id="saveBtn"
      >
        SAVE
      </button>

      <button
        class="info-btn list-btn"
        id="listBtn"
      >
        LIST
      </button>

    </div>

  </div>


  <!-- SUMMARY -->
  <div class="table-wrap">

    <table>

      <colgroup>
        <col style="width:18%">
        <col style="width:16.4%">
        <col style="width:16.4%">
        <col style="width:16.4%">
        <col style="width:16.4%">
        <col style="width:16.4%">
      </colgroup>

      <thead>

        <tr>
          <th colspan="6" class="summary-title">
            SUMMARY
          </th>
        </tr>

        <tr class="summary-head">
          <th>Metric</th>
          <th>R</th>
          <th>P</th>
          <th>L</th>
          <th>M</th>
          <th>C</th>
        </tr>

      </thead>

      <tbody>

        <tr class="summary-row del-row">

          <td class="summary-label">
            DEL
          </td>

          <td>
            <input
              id="delR"
              class="del-input"
              type="number"
              inputmode="decimal"
            >
          </td>

          <td>
            <input
              id="delP"
              class="del-input"
              type="number"
              inputmode="decimal"
            >
          </td>

          <td>
            <input
              id="delL"
              class="del-input"
              type="number"
              inputmode="decimal"
            >
          </td>

          <td>
            <input
              id="delM"
              class="del-input"
              type="number"
              inputmode="decimal"
            >
          </td>

          <td>
            <input
              id="delC"
              class="del-input"
              type="number"
              inputmode="decimal"
            >
          </td>

        </tr>

        <tr class="summary-row sales-row">

          <td class="summary-label">
            SALES
          </td>

          <td id="salesR">0</td>
          <td id="salesP">0</td>
          <td id="salesL">0</td>
          <td id="salesM">0</td>
          <td id="salesC">0</td>

        </tr>

        <tr class="summary-row ret-row">

          <td class="summary-label">
            RET
          </td>

          <td id="retR">0</td>
          <td id="retP">0</td>
          <td id="retL">0</td>
          <td id="retM">0</td>
          <td id="retC">0</td>

        </tr>

      </tbody>

    </table>

  </div>


  <!-- CUSTOMER TABLE -->
  <div class="customer-wrap">

    <table class="customer-table">

      <colgroup>
        <col class="name-col">
        <col class="qty-col">
        <col class="qty-col">
        <col class="qty-col">
        <col class="qty-col">
        <col class="qty-col">
        <col class="amount-col">
      </colgroup>

      <thead>

        <tr class="customer-header">

          <th
            id="nameHeader"
            title="5 taps to open multiplier settings"
          >
            🔑
          </th>

          <th>R</th>
          <th>P</th>
          <th>L</th>
          <th>M</th>
          <th>C</th>
          <th>Amount</th>

        </tr>

      </thead>

      <tbody id="customerBody"></tbody>

      <tfoot>

        <tr class="total-row">

          <td class="total-label">
            TOTAL
          </td>

          <td id="totalR">0</td>
          <td id="totalP">0</td>
          <td id="totalL">0</td>
          <td id="totalM">0</td>
          <td id="totalC">0</td>

          <td id="totalAmount">0</td>

        </tr>

      </tfoot>

    </table>

  </div>

</div>


<!-- =========================
     START LEDGER MODAL
========================= -->

<div class="modal" id="setupModal">

  <div class="modal-box">

    <div class="modal-title">
      Start Ledger
    </div>

    <div class="modal-field">

      <label for="ledgerDate">
        DATE
      </label>

      <input
        type="date"
        id="ledgerDate"
        autocomplete="off"
      >

    </div>

    <div class="modal-field">

      <label for="ledgerName">
        NAME
      </label>

      <input
        type="text"
        id="ledgerName"
        autocomplete="off"
        placeholder="Enter name"
      >

    </div>

    <div
      class="setup-error"
      id="setupError"
    ></div>

    <button
      class="modal-btn"
      id="openLedgerBtn"
    >
      OPEN LEDGER
    </button>

  </div>

</div>


<!-- =========================
     MULTIPLIER MODAL
========================= -->

<div
  class="modal hidden"
  id="multiplierModal"
>

  <div class="modal-box">

    <div class="modal-title">
      Edit Multipliers
    </div>

    <div class="multiplier-grid">

      <div class="multiplier-item">
        <label>R</label>
        <input
          id="multR"
          type="number"
          inputmode="decimal"
        >
      </div>

      <div class="multiplier-item">
        <label>P</label>
        <input
          id="multP"
          type="number"
          inputmode="decimal"
        >
      </div>

      <div class="multiplier-item">
        <label>L</label>
        <input
          id="multL"
          type="number"
          inputmode="decimal"
        >
      </div>

      <div class="multiplier-item">
        <label>M</label>
        <input
          id="multM"
          type="number"
          inputmode="decimal"
        >
      </div>

      <div class="multiplier-item">
        <label>C</label>
        <input
          id="multC"
          type="number"
          inputmode="decimal"
        >
      </div>

    </div>

    <div class="multiplier-actions">

      <button
        class="cancel-btn"
        id="cancelMultiplier"
      >
        CANCEL
      </button>

      <button
        class="save-btn"
        id="saveMultiplier"
      >
        SAVE
      </button>

    </div>

  </div>

</div>


<!-- =========================
     SAVED FILE LIST MODAL
========================= -->

<div
  class="modal hidden"
  id="listModal"
>

  <div class="list-modal-box">

    <div class="list-title">
      SAVED LEDGER FILES
    </div>

    <div class="list-subtitle">
      Tap a file to preview • Tap again to return to current
    </div>

    <div
      class="saved-list"
      id="savedList"
    ></div>

    <button
      class="list-close-btn"
      id="closeListBtn"
    >
      CLOSE
    </button>

  </div>

</div>


<script>

/* =========================
   SERVICE WORKER
========================= */

if('serviceWorker' in navigator){

  window.addEventListener(
    'load',
    () => {

      navigator.serviceWorker.register(
        './sw.js?v=2',
        {scope:'./'}
      )
      .then(
        reg =>
          console.log(
            'Service Worker Registered!'
          )
      )
      .catch(
        err =>
          console.log(
            'Service Worker Registration Failed:',
            err
          )
      );

    }
  );

}


/* =========================
   STORAGE
========================= */

const SAVED_FILES_KEY =
  "rplmc_saved_files";

const MAX_SAVED_FILES = 30;


/* =========================
   MULTIPLIERS
========================= */

const DEFAULT_MULTIPLIERS = {
  R:45,
  P:45,
  L:45,
  M:45,
  C:40
};

let multipliers =
  JSON.parse(
    localStorage.getItem(
      "rplmc_multipliers"
    )
  ) || {...DEFAULT_MULTIPLIERS};


/* =========================
   ELEMENTS
========================= */

const setupModal =
  document.getElementById(
    "setupModal"
  );

const setupError =
  document.getElementById(
    "setupError"
  );

const ledgerDate =
  document.getElementById(
    "ledgerDate"
  );

const ledgerName =
  document.getElementById(
    "ledgerName"
  );

const displayDate =
  document.getElementById(
    "displayDate"
  );

const displayName =
  document.getElementById(
    "displayName"
  );

const customerBody =
  document.getElementById(
    "customerBody"
  );

const multiplierModal =
  document.getElementById(
    "multiplierModal"
  );

const nameHeader =
  document.getElementById(
    "nameHeader"
  );

const listModal =
  document.getElementById(
    "listModal"
  );

const savedList =
  document.getElementById(
    "savedList"
  );


/* =========================
   STATE
========================= */

let readonlyMode = false;

let selectedSavedId = null;

let currentPreviewId = null;

let currentLedgerStarted = false;

let temporaryCurrentState = null;


/* =========================
   NUMBER
========================= */

function num(value){

  const n =
    parseFloat(value);

  return Number.isFinite(n)
    ? n
    : 0;

}


/* =========================
   AMOUNT FORMAT
========================= */

function formatAmount(value){

  const n = num(value);

  if(n === 0){
    return "0";
  }

  if(Number.isInteger(n)){
    return String(n);
  }

  return n
    .toFixed(2)
    .replace(/\.?0+$/,"");

}


/* =========================
   DATE
========================= */

function formatDate(value){

  if(!value){
    return "";
  }

  const parts =
    value.split("-");

  if(parts.length !== 3){
    return value;
  }

  const y =
    Number(parts[0]);

  const m =
    Number(parts[1]);

  const d =
    Number(parts[2]);

  const months = [
    "Jan","Feb","Mar","Apr",
    "May","Jun","Jul","Aug",
    "Sep","Oct","Nov","Dec"
  ];

  return `${months[m-1]} ${d}, ${y}`;

}


/* =========================
   TIME FORMAT
========================= */

function formatSavedTime(timestamp){

  if(!timestamp){
    return "";
  }

  const d =
    new Date(timestamp);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleTimeString(
    [],
    {
      hour:"numeric",
      minute:"2-digit",
      second:"2-digit"
    }
  );

}


/* =========================
   GET SAVED FILES
========================= */

function getSavedFiles(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(
          SAVED_FILES_KEY
        )
      );

    if(!Array.isArray(data)){
      return [];
    }

    return data;

  }catch(e){

    return [];

  }

}


/* =========================
   SAVE FILES
========================= */

function setSavedFiles(files){

}

/* =========================
   CALCULATE
========================= */

function calculate(){

  let totalR = 0;
  let totalP = 0;
  let totalL = 0;
  let totalM = 0;
  let totalC = 0;

  let totalAmount = 0;


  const rows =
    document.querySelectorAll(
      ".customer-row"
    );


  rows.forEach(row => {

    const r =
      num(
        row.querySelector(
          ".qty-r"
        ).value
      );

    const p =
      num(
        row.querySelector(
          ".qty-p"
        ).value
      );

    const l =
      num(
        row.querySelector(
          ".qty-l"
        ).value
      );

    const m =
      num(
        row.querySelector(
          ".qty-m"
        ).value
      );

    const c =
      num(
        row.querySelector(
          ".qty-c"
        ).value
      );


    totalR += r;
    totalP += p;
    totalL += l;
    totalM += m;
    totalC += c;


    const amount =
      (r * multipliers.R) +
      (p * multipliers.P) +
      (l * multipliers.L) +
      (m * multipliers.M) +
      (c * multipliers.C);


    totalAmount += amount;


    row.querySelector(
      ".amount-value"
    ).textContent =
      formatAmount(amount);

  });


  document.getElementById(
    "totalR"
  ).textContent =
    formatAmount(totalR);

  document.getElementById(
    "totalP"
  ).textContent =
    formatAmount(totalP);

  document.getElementById(
    "totalL"
  ).textContent =
    formatAmount(totalL);

  document.getElementById(
    "totalM"
  ).textContent =
    formatAmount(totalM);

  document.getElementById(
    "totalC"
  ).textContent =
    formatAmount(totalC);

  document.getElementById(
    "totalAmount"
  ).textContent =
    formatAmount(totalAmount);


  /* SALES */

  document.getElementById(
    "salesR"
  ).textContent =
    formatAmount(totalR);

  document.getElementById(
    "salesP"
  ).textContent =
    formatAmount(totalP);

  document.getElementById(
    "salesL"
  ).textContent =
    formatAmount(totalL);

  document.getElementById(
    "salesM"
  ).textContent =
    formatAmount(totalM);

  document.getElementById(
    "salesC"
  ).textContent =
    formatAmount(totalC);


  /* RET */

  const delR =
    num(
      document.getElementById(
        "delR"
      ).value
    );

  const delP =
    num(
      document.getElementById(
        "delP"
      ).value
    );

  const delL =
    num(
      document.getElementById(
        "delL"
      ).value
    );

  const delM =
    num(
      document.getElementById(
        "delM"
      ).value
    );

  const delC =
    num(
      document.getElementById(
        "delC"
      ).value
    );


  document.getElementById(
    "retR"
  ).textContent =
    formatAmount(
      delR - totalR
    );

  document.getElementById(
    "retP"
  ).textContent =
    formatAmount(
      delP - totalP
    );

  document.getElementById(
    "retL"
  ).textContent =
    formatAmount(
      delL - totalL
    );

  document.getElementById(
    "retM"
  ).textContent =
    formatAmount(
      delM - totalM
    );

  document.getElementById(
    "retC"
  ).textContent =
    formatAmount(
      delC - totalC
    );

}


/* =========================
   CAPTURE LEDGER
========================= */

function captureLedger(){

  const rows =
    Array.from(
      document.querySelectorAll(
        ".customer-row"
      )
    );

  return {

    date:
      ledgerDate.value.trim(),

    name:
      ledgerName.value.trim(),

    del:{
      R:document.getElementById("delR").value,
      P:document.getElementById("delP").value,
      L:document.getElementById("delL").value,
      M:document.getElementById("delM").value,
      C:document.getElementById("delC").value
    },

    rows:
      rows.map(row => ({

        name:
          row.querySelector(
            ".name-input"
          ).value,

        R:
          row.querySelector(
            ".qty-r"
          ).value,

        P:
          row.querySelector(
            ".qty-p"
          ).value,

        L:
          row.querySelector(
            ".qty-l"
          ).value,

        M:
          row.querySelector(
            ".qty-m"
          ).value,

        C:
          row.querySelector(
            ".qty-c"
          ).value

      }))

  };

}


/* =========================
   APPLY LEDGER
========================= */

function applyLedger(data){

  if(!data){
    return;
  }


  ledgerDate.value =
    data.date || "";

  ledgerName.value =
    data.name || "";


  const del =
    data.del || {};


  document.getElementById(
    "delR"
  ).value =
    del.R || "";

  document.getElementById(
    "delP"
  ).value =
    del.P || "";

  document.getElementById(
    "delL"
  ).value =
    del.L || "";

  document.getElementById(
    "delM"
  ).value =
    del.M || "";

  document.getElementById(
    "delC"
  ).value =
    del.C || "";


  const rows =
    document.querySelectorAll(
      ".customer-row"
    );

  const savedRows =
    Array.isArray(data.rows)
      ? data.rows
      : [];


  rows.forEach((row,index) => {

    const item =
      savedRows[index] || {};


    row.querySelector(
      ".name-input"
    ).value =
      item.name || "";

    row.querySelector(
      ".qty-r"
    ).value =
      item.R || "";

    row.querySelector(
      ".qty-p"
    ).value =
      item.P || "";

    row.querySelector(
      ".qty-l"
    ).value =
      item.L || "";

    row.querySelector(
      ".qty-m"
    ).value =
      item.M || "";

    row.querySelector(
      ".qty-c"
    ).value =
      item.C || "";

  });


  displayDate.textContent =
    formatDate(
      data.date || ""
    );

  displayName.textContent =
    data.name || "";


  calculate();

}

      "Please enter the Date.";

    ledgerDate.focus();

  }

      "Please enter the Name.";

    return;

  }


  displayDate.textContent =
    formatDate(date);

  displayName.textContent =
    name;

    "hidden"
  );

  currentLedgerStarted = true;

  readonlyMode = false;

  currentPreviewId = null;

  document.body.classList.remove(
    "readonly-mode"
  );

}

/* =========================
   SAVE CURRENT FILE
========================= */

function saveCurrentFile(){

  if(!currentLedgerStarted){

    alert(
      "Please start the ledger first."
    );

    return;

  }


  if(readonlyMode){

    alert(
      "This is a read-only preview. Tap EDIT first."
    );

    return;

  }


  const date =
    ledgerDate.value.trim();

  const name =
    ledgerName.value.trim();


  if(!date){

    alert(
      "Please enter the Date first."
    );

    return;

  }


  if(!name){

    alert(
      "Please enter the Name first."
    );

    return;

  }


  const now =
    Date.now();

  const data =
    captureLedger();

  let files =
    getSavedFiles();


  const existingIndex =
    files.findIndex(
      file =>
        file.date === date
    );


  if(existingIndex !== -1){

    const existing =
      files[existingIndex];

    const replace =
      confirm(
        `A saved file already exists for ${formatDate(date)}.\n\n` +
        `Name: ${existing.name}\n` +
        `Saved: ${formatSavedTime(existing.savedAt)}\n\n` +
        `Replace it with the current ledger?`
      );

    if(!replace){
      return;
    }


    files.splice(
      existingIndex,
      1
    );

  }


  const file = {

    id:
      "rplmc-" +
      now +
      "-" +
      Math.random()
        .toString(36)
        .slice(2,8),

    date:
      date,

    name:
      name,

    savedAt:
      now,

    data:
      data

  };


  files.unshift(file);


  files.sort(
    (a,b) =>
      Number(b.savedAt || 0) -
      Number(a.savedAt || 0)
  );


  if(
    files.length >
    MAX_SAVED_FILES
  ){

    files =
      files.slice(
        0,
        MAX_SAVED_FILES
      );

  }


  setSavedFiles(files);


  alert(
    "Ledger saved successfully."
  );


  renderSavedList();

}


/* =========================
   OPEN LIST
========================= */

function openSavedList(){

  renderSavedList();

  listModal.classList.remove(
    "hidden"
  );

}


/* =========================
   RENDER LIST
========================= */

function renderSavedList(){

  savedList.innerHTML = "";


  let files =
    getSavedFiles();


  files.sort(
    (a,b) =>
      Number(b.savedAt || 0) -
      Number(a.savedAt || 0)
  );


  if(files.length === 0){

    savedList.innerHTML = `
      <div class="empty-list">
        No saved ledger files yet.
      </div>
    `;

    return;

  }


  files.forEach(
    (file,index) => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "saved-item" +
        (
          selectedSavedId === file.id
            ? " highlighted"
            : ""
        );


      item.innerHTML = `

        <div
          class="saved-main"
          data-id="${file.id}"
        >

          <div class="saved-number">
            ${index + 1}
          </div>

          <div class="saved-info">

            <div class="saved-date">
              ${escapeHtml(
                formatDate(file.date)
              )}
            </div>

            <div class="saved-name">
              ${escapeHtml(
                file.name || ""
              )}
            </div>

            <div class="saved-time">
              Saved ${escapeHtml(
                formatSavedTime(
                  file.savedAt
                )
              )}
            </div>

          </div>

        </div>

        <div class="saved-actions">

          <button
            class="saved-action edit-saved-btn"
            data-edit="${file.id}"
          >
            EDIT
          </button>

          <button
            class="saved-action delete-saved-btn"
            data-delete="${file.id}"
          >
            DELETE
          </button>

        </div>

      `;


      savedList.appendChild(
        item
      );

    }
  );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   PREVIEW SAVED FILE
========================= */

function previewSavedFile(id){

  const files =
    getSavedFiles();

  const file =
    files.find(
      item =>
        item.id === id
    );


  if(!file){
    return;
  }


  /* Same highlighted item:
     return to current */

  if(
    selectedSavedId === id &&
    readonlyMode
  ){

    returnToCurrent();

    return;

  }


  /* Save current editable
     state before preview */

  if(
    !readonlyMode &&
    currentLedgerStarted
  ){

    temporaryCurrentState =
      captureLedger();

  }


  selectedSavedId =
    id;

  currentPreviewId =
    id;

  readonlyMode =
    true;


  applyLedger(
    file.data
  );


  document.body.classList.add(
    "readonly-mode"
  );


  renderSavedList();

}


/* =========================
   RETURN TO CURRENT
========================= */

function returnToCurrent(){

  if(
    temporaryCurrentState
  ){

    applyLedger(
      temporaryCurrentState
    );

  }


  readonlyMode =
    false;

  currentPreviewId =
    null;

  selectedSavedId =
    null;

  document.body.classList.remove(
    "readonly-mode"
  );


  renderSavedList();

}


/* =========================
   EDIT SAVED FILE
========================= */

function editSavedFile(id){

  const files =
    getSavedFiles();

  const file =
    files.find(
      item =>
        item.id === id
    );


  if(!file){
    return;
  }


  applyLedger(
    file.data
  );


  currentLedgerStarted =
    true;

  readonlyMode =
    false;

  currentPreviewId =
    null;

  selectedSavedId =
    null;

  temporaryCurrentState =
    null;


  document.body.classList.remove(
    "readonly-mode"
  );


  listModal.classList.add(
    "hidden"
  );

}


/* =========================
   DELETE SAVED FILE
========================= */

function deleteSavedFile(id){

  const files =
    getSavedFiles();

  const file =
    files.find(
      item =>
        item.id === id
    );


  if(!file){
    return;
  }


  const okay =
    confirm(
      `Delete this saved file?\n\n` +
      `${formatDate(file.date)}\n` +
      `${file.name}`
    );


  if(!okay){
    return;
  }


  const remaining =
    files.filter(
      item =>
        item.id !== id
    );


  setSavedFiles(
    remaining
  );


  if(
    selectedSavedId === id
  ){

    selectedSavedId =
      null;

    currentPreviewId =
      null;

    readonlyMode =
      false;

    document.body.classList.remove(
      "readonly-mode"
    );

  }


  renderSavedList();

}


/* =========================
   CLEAR CURRENT
========================= */

function clearCurrentLedger(){

  if(!currentLedgerStarted){

    return;

  }


  if(readonlyMode){

    alert(
      "This is a read-only preview. Return to the current ledger first."
    );

    return;

  }


  const current =
    captureLedger();


  const hasData =
    hasLedgerData(current);


  if(hasData){

    const saveFirst =
      confirm(
        "The current ledger contains data.\n\n" +
        "Do you want to SAVE the current ledger before clearing it?\n\n" +
        "OK = Save first\n" +
        "Cancel = Continue without saving"
      );


    if(saveFirst){

      saveCurrentFile();

      /*
       * If user cancelled an overwrite
       * or saving failed, don't clear.
       */
      const date =
        current.date;

      const files =
        getSavedFiles();

      const saved =
        files.some(
          file =>
            file.date === date
        );

      if(!saved){
        return;
      }

    }else{

      const confirmClear =
        confirm(
          "Clear the current ledger without saving?"
        );

      if(!confirmClear){
        return;
      }

    }

  }else{

    const confirmClear =
      confirm(
        "Clear the current ledger?"
      );

    if(!confirmClear){
      return;
    }

  }


  clearLedgerValues();

}


/* =========================
   HAS LEDGER DATA
========================= */

function hasLedgerData(data){

  if(!data){
    return false;
  }


  const del =
    data.del || {};


  if(
    Object.values(del)
      .some(value =>
        String(value || "").trim() !== ""
      )
  ){

    return true;

  }


  if(
    Array.isArray(data.rows)
  ){

    return data.rows.some(
      row =>
        Object.values(row)
          .some(value =>
            String(value || "").trim() !== ""
          )
    );

  }


  return false;

}

    const deleteButton =
      e.target.closest(
        "[data-delete]"
      );


    if(editButton){

      editSavedFile(
        editButton.dataset.edit
      );

      return;

    }


    if(deleteButton){

      deleteSavedFile(
        deleteButton.dataset.delete
      );

      return;

    }


    if(main){

      previewSavedFile(
        main.dataset.id
      );

    }

  }
);


/* =========================
   CLOSE LIST BY OUTSIDE TAP
========================= */

listModal.addEventListener(
  "click",
  e => {

    if(
      e.target === listModal
    ){

      listModal.classList.add(
        "hidden"
      );

    }

  }
);


/* =========================
   5-TAP KEY
========================= */

let tapCount = 0;
let tapTimer = null;

nameHeader.addEventListener(
  "click",
  () => {

    tapCount++;

    clearTimeout(
      tapTimer
    );

    tapTimer =
      setTimeout(
        () => {
          tapCount = 0;
        },
        1000
      );


    if(tapCount >= 5){

      tapCount = 0;

      clearTimeout(
        tapTimer
      );

      openMultiplierEditor();

    }

  }
);


/* =========================
   CLOSE MULTIPLIER
========================= */

multiplierModal.addEventListener(
  "click",
  e => {

    if(
      e.target === multiplierModal
    ){

      multiplierModal.classList.add(
        "hidden"
      );

    }

  }
);


/* =========================
   CANCEL MULTIPLIER
========================= */

document
  .getElementById(
    "cancelMultiplier"
  )
  .addEventListener(
    "click",
    () => {

      multiplierModal.classList.add(
        "hidden"
      );

    }
  );


/* =========================
   SAVE MULTIPLIER
========================= */

document
  .getElementById(
    "saveMultiplier"
  )
  .addEventListener(
    "click",
    saveMultipliers
  );


/* =========================
   DEL INPUTS
========================= */

[
  "delR",
  "delP",
  "delL",
  "delM",
  "delC"
].forEach(id => {

  document
    .getElementById(id)
    .addEventListener(
      "input",
      calculate
    );

});


/* =========================
   INITIALIZE
========================= */

buildRows();

calculate();

loadSession();

</script>

</body>
</html>
