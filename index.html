<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RPLMC Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden; /* Fits everything in one screen height */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #333;
    }
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 2px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    /* Ultra-thin grid lines matching screenshot style */
    th, td {
      border: 1px solid #d1d5db;
      padding: 1px 2px;
      text-align: center;
      font-size: 11px;
      height: 19px;
    }
    th {
      background-color: #f8fafc;
      font-weight: 600;
      color: #475569;
    }
    input {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      text-align: center;
      font-size: 11px;
      color: #1e293b;
      padding: 0;
    }
    /* Rounded box style for name column inputs */
    .name-input {
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background-color: #f8fafc;
      height: 16px;
    }
    .calc-val {
      font-weight: 600;
      color: #0f172a;
    }
    .total-row {
      background-color: #f1f5f9;
      font-weight: bold;
      color: #dc2626; /* Highlight total line */
    }
    .table-title {
      font-size: 10px;
      font-weight: bold;
      color: #64748b;
      text-transform: uppercase;
      margin: 2px 0 1px 2px;
    }
    /* Column widths */
    col.col-name { width: 25%; }
    col.col-item { width: 15%; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="table-title">Summary</div>
    <table id="table1">
      <colgroup>
        <col class="col-name">
        <col class="col-item"><col class="col-item"><col class="col-item"><col class="col-item"><col class="col-item">
      </colgroup>
      <thead>
        <tr>
          <th>Metric</th>
          <th>R</th><th>P</th><th>L</th><th>M</th><th>C</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><strong>Del</strong></td>
          <td><input type="number" class="del-input" value="0" oninput="calculate()"></td>
          <td><input type="number" class="del-input" value="0" oninput="calculate()"></td>
          <td><input type="number" class="del-input" value="0" oninput="calculate()"></td>
          <td><input type="number" class="del-input" value="0" oninput="calculate()"></td>
          <td><input type="number" class="del-input" value="0" oninput="calculate()"></td>
        </tr>
        <tr>
          <td><strong>Sales</strong></td>
          <td id="sales-r" class="calc-val">0</td>
          <td id="sales-p" class="calc-val">0</td>
          <td id="sales-l" class="calc-val">0</td>
          <td id="sales-m" class="calc-val">0</td>
          <td id="sales-c" class="calc-val">0</td>
        </tr>
        <tr>
          <td><strong>Ret</strong></td>
          <td id="ret-r" class="calc-val">0</td>
          <td id="ret-p" class="calc-val">0</td>
          <td id="ret-l" class="calc-val">0</td>
          <td id="ret-m" class="calc-val">0</td>
          <td id="ret-c" class="calc-val">0</td>
        </tr>
      </tbody>
    </table>

    <div class="table-title">Itemized Entries</div>
    <table id="table2">
      <colgroup>
        <col class="col-name">
        <col class="col-item"><col class="col-item"><col class="col-item"><col class="col-item"><col class="col-item">
      </colgroup>
      <thead>
        <tr>
          <th>Name</th>
          <th>R</th><th>P</th><th>L</th><th>M</th><th>C</th>
        </tr>
      </thead>
      <tbody id="table2-body">
        <!-- 19 entry rows generated dynamically -->
      </tbody>
      <tfoot>
        <tr class="total-row">
          <td>TOTAL</td>
          <td id="tot-r">0</td>
          <td id="tot-p">0</td>
          <td id="tot-l">0</td>
          <td id="tot-m">0</td>
          <td id="tot-c">0</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <script>
    const tbody = document.getElementById('table2-body');
    
    // Generate Rows 2 to 20 (19 rows total)
    for (let i = 1; i <= 19; i++) {
      const tr = document.createElement('tr');
      
      // Rounded text box for Name column
      const tdName = document.createElement('td');
      tdName.innerHTML = `<input type="text" class="name-input">`;
      tr.appendChild(tdName);

      // RPLMC entry fields
      ['r', 'p', 'l', 'm', 'c'].forEach(col => {
        const td = document.createElement('td');
        td.innerHTML = `<input type="number" class="input-${col}" oninput="calculate()">`;
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    }

    function calculate() {
      const cols = ['r', 'p', 'l', 'm', 'c'];
      const delInputs = document.querySelectorAll('.del-input');

      cols.forEach((col, index) => {
        const inputs = document.querySelectorAll(`.input-${col}`);
        let sum = 0;
        inputs.forEach(input => {
          sum += parseFloat(input.value) || 0;
        });

        // Update Table 2 Totals
        document.getElementById(`tot-${col}`).innerText = sum;

        // Update Table 1 Sales
        document.getElementById(`sales-${col}`).innerText = sum;

        // Calculate and Update Table 1 Ret (Del - Sales)
        const delVal = parseFloat(delInputs[index].value) || 0;
        document.getElementById(`ret-${col}`).innerText = delVal - sum;
      });
    }
  </script>

</body>
</html>
