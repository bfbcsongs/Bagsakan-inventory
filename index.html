<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPLMC Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 15px;
      background-color: #f4f6f9;
      color: #333;
    }
    h2 {
      margin-top: 20px;
      margin-bottom: 10px;
      color: #2c3e50;
    }
    .table-container {
      overflow-x: auto;
      margin-bottom: 25px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 500px;
    }
    th, td {
      border: 1px solid #dfe6e9;
      padding: 8px 12px;
      text-align: center;
    }
    th {
      background-color: #34495e;
      color: white;
      font-weight: bold;
    }
    tr:nth-child(even) {
      background-color: #f8f9fa;
    }
    input[type="number"], input[type="text"] {
      width: 85%;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: center;
      box-sizing: border-box;
    }
    input[type="number"]:focus, input[type="text"]:focus {
      border-color: #3498db;
      outline: none;
    }
    .calculated-cell {
      background-color: #e8f4f8;
      font-weight: bold;
    }
    .total-row {
      background-color: #eaeded !important;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Summary Table</h2>
  <div class="table-container">
    <table id="table1">
      <thead>
        <tr>
          <th>Metric</th>
          <th>R</th>
          <th>P</th>
          <th>L</th>
          <th>M</th>
          <th>C</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><strong>Del</strong></td>
          <td><input type="number" class="del-input" value="0" oninput="calculate()"></td>
          <td><input type="number" class="del-input" value="0" oninput="calculate()"></td>
          <td><input type="number" class="del-input" value="0" oninput="calculate()"></td>
          <td><input type="number" class="del-input" value="0" oninput="calculate()"></td>
          <td><input type="number" class="del-input" value="0" oninput="calculate()"></td>
        </tr>
        <tr>
          <td><strong>Sales</strong></td>
          <td id="sales-r" class="calculated-cell">0</td>
          <td id="sales-p" class="calculated-cell">0</td>
          <td id="sales-l" class="calculated-cell">0</td>
          <td id="sales-m" class="calculated-cell">0</td>
          <td id="sales-c" class="calculated-cell">0</td>
        </tr>
        <tr>
          <td><strong>Ret</strong></td>
          <td id="ret-r" class="calculated-cell">0</td>
          <td id="ret-p" class="calculated-cell">0</td>
          <td id="ret-l" class="calculated-cell">0</td>
          <td id="ret-m" class="calculated-cell">0</td>
          <td id="ret-c" class="calculated-cell">0</td>
        </tr>
      </tbody>
    </table>
  </div>

  <h2>Itemized Sales Table</h2>
  <div class="table-container">
    <table id="table2">
      <thead>
        <tr>
          <th>Name</th>
          <th>R</th>
          <th>P</th>
          <th>L</th>
          <th>M</th>
          <th>C</th>
        </tr>
      </thead>
      <tbody id="table2-body">
        <!-- Rows 2 to 20 dynamically generated -->
      </tbody>
      <tfoot>
        <tr class="total-row">
          <td>Total</td>
          <td id="tot-r">0</td>
          <td id="tot-p">0</td>
          <td id="tot-l">0</td>
          <td id="tot-m">0</td>
          <td id="tot-c">0</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <script>
    // Build rows 2 to 20 for Table 2
    const tbody = document.getElementById('table2-body');
    for (let i = 1; i <= 19; i++) {
      const tr = document.createElement('tr');
      
      // Name input
      const tdName = document.createElement('td');
      tdName.innerHTML = `<input type="text" placeholder="Entry ${i}">`;
      tr.appendChild(tdName);

      // RPLMC inputs
      ['r', 'p', 'l', 'm', 'c'].forEach(col => {
        const td = document.createElement('td');
        td.innerHTML = `<input type="number" class="input-${col}" value="0" oninput="calculate()">`;
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    }

    function calculate() {
      const cols = ['r', 'p', 'l', 'm', 'c'];
      const delInputs = document.querySelectorAll('.del-input');

      cols.forEach((col, index) => {
        // Calculate Total for Table 2
        const inputs = document.querySelectorAll(`.input-${col}`);
        let sum = 0;
        inputs.forEach(input => {
          sum += parseFloat(input.value) || 0;
        });

        // Update Table 2 Totals
        document.getElementById(`tot-${col}`).innerText = sum;

        // Update Table 1 Sales
        document.getElementById(`sales-${col}`).innerText = sum;

        // Calculate and Update Table 1 Ret (Del - Sales)
        const delVal = parseFloat(delInputs[index].value) || 0;
        const retVal = delVal - sum;
        document.getElementById(`ret-${col}`).innerText = retVal;
      });
    }
  </script>

</body>
</html>
